services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expresspossess
      POSTGRES_USER: expresspossess
      POSTGRES_PASSWORD: expresspossess
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expresspossess"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the application sends. Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
