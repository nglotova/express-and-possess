spring:
  application:
    name: express-and-possess-notifier
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notifier
      auto-offset-reset: earliest
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Mailpit needs no login; a real mail service such as Brevo needs all four.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}

notifier:
  topic: notifications
  mail-from: ${MAIL_FROM:no-reply@expresspossess.local}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
