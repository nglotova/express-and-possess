# One complete instance of Express & Possess. Run it twice with different project names
# and env files: once for the family, once for the public demo. Caddy (deploy/caddy) sits
# in front of both and handles the domain names and certificates.
#
#   docker compose -p family --env-file family.env -f compose.yml up -d --build
#   docker compose -p demo   --env-file demo.env   -f compose.yml up -d --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expresspossess
      POSTGRES_USER: expresspossess
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expresspossess"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # The demo exposes this through Caddy so reviewers can read the emails. The family
  # instance uses a real SMTP server instead and simply leaves it unused.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

  api:
    build:
      context: ..
      target: api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/expresspossess
      DB_USER: expresspossess
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: https://${DOMAIN}
      APP_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_DEMO_ENABLED: ${DEMO:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  notifier:
    build:
      context: ..
      target: notifier
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../web
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  uploads:
