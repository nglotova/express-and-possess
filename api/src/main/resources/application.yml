spring:
  application:
    name: express-and-possess
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expresspossess}
    username: ${DB_USER:expresspossess}
    password: ${DB_PASSWORD:expresspossess}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    problemdetails:
      enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@expresspossess.local}
  password-reset-ttl: 1h

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
