spring:
  application:
    name: express-and-possess
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expresspossess}
    username: ${DB_USER:expresspossess}
    password: ${DB_PASSWORD:expresspossess}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@expresspossess.local}
  password-reset-ttl: 1h
  invitation-ttl: 7d
  uploads-dir: ${UPLOADS_DIR:./uploads}
  notifications-topic: notifications
  outbox-poll-interval: 1s
  # Comma-separated. Register with one of these addresses to get the administration page.
  admin-emails: ${APP_ADMIN_EMAILS:}
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    reset-cron: "0 0 3 * * *"
    password: demo-password

server:
  port: 8080
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
